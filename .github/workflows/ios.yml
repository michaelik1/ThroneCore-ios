name: iOS

on:
  pull_request:
    paths:
      - 'core/**'
      - 'script/build_ios.sh'
      - 'script/test_ios.sh'
      - 'script/build_ios_example.sh'
      - 'apple/**'
      - '.github/workflows/ios.yml'
  push:
    branches: [dev]
    paths:
      - 'core/**'
      - 'script/build_ios.sh'
      - 'script/test_ios.sh'
      - 'script/build_ios_example.sh'
      - 'apple/**'
      - '.github/workflows/ios.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  xcframework:
    name: XCFramework (device + simulators)
    runs-on: macos-15-intel
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: '1.27.1'
          cache-dependency-path: core/go.sum
      - name: Test mobile contracts and Darwin FD ownership
        working-directory: core
        run: >-
          go test -mod=readonly
          -tags 'with_gvisor,with_quic,with_wireguard,with_utls,with_clash_api,with_openvpn,with_openconnect,badlinkname,tfogo_checklinkname0'
          -ldflags '-checklinkname=0' ./mobile
      - name: Build full mobile runtime
        run: ./script/build_ios.sh
      - name: Archive XCFramework
        run: ditto -c -k --sequesterRsrc --keepParent deployment/ios/ThroneCore.xcframework deployment/ios/ThroneCore.xcframework.zip
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: ThroneCore-ios-${{ github.sha }}
          path: |
            deployment/ios/ThroneCore.xcframework.zip
            deployment/ios/build-info.txt
          if-no-files-found: error
          compression-level: 0
      - name: Exercise Swift and embedded Xray on iOS Simulator
        timeout-minutes: 20
        run: ./script/test_ios.sh
      - name: Build unsigned packet-tunnel host for simulator and device
        timeout-minutes: 20
        run: ./script/build_ios_example.sh
      - name: Archive simulator test results
        if: always()
        run: |
          if [ -d deployment/ios/RuntimeSmoke.xcresult ]; then
            ditto -c -k --sequesterRsrc --keepParent deployment/ios/RuntimeSmoke.xcresult deployment/ios/RuntimeSmoke.xcresult.zip
          fi
      - name: Upload simulator test results
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: ThroneCore-ios-tests-${{ github.sha }}
          path: |
            deployment/ios/runtime-smoke.log
            deployment/ios/RuntimeSmoke.xcresult.zip
            deployment/ios/example-iphonesimulator.log
            deployment/ios/example-iphoneos.log
          if-no-files-found: ignore

  android-regression:
    name: Android and desktop regression
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      NDK_VERSION: '28.2.13676358'
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: '1.27.1'
          cache-dependency-path: core/go.sum
      - uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: '17'
      - name: Test shared mobile and Xray contracts
        working-directory: core
        env:
          CGO_ENABLED: '0'
        run: >-
          go test -mod=readonly
          -tags 'with_gvisor,with_quic,with_wireguard,with_utls,with_clash_api,with_openvpn,with_openconnect,badlinkname,tfogo_checklinkname0'
          -ldflags '-checklinkname=0' ./mobile ./internal/xray ./internal/xraydns ./internal/probe
      - name: Install pinned Android tools
        run: |
          echo y | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$NDK_VERSION"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"
          cd core
          VERSION=$(go list -mod=readonly -m -f '{{.Version}}' github.com/sagernet/gomobile)
          go install "github.com/sagernet/gomobile/cmd/gomobile@$VERSION"
          go install "github.com/sagernet/gomobile/cmd/gobind@$VERSION"
      - name: Build unchanged Android target
        run: ./script/build_android.sh
      - uses: arduino/setup-protoc@v3
        with:
          version: '31.1'
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Compile desktop core (non-Naive smoke)
        env:
          CGO_ENABLED: '0'
        run: |
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.12
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@v1.6.2
          cd core/gen
          protoc -I . --go_out=. --go-grpc_out=. libcore.proto
          cd ..
          go build -mod=readonly -trimpath -ldflags '-checklinkname=0' \
            -tags 'with_clash_api,with_quic,with_wireguard,with_utls,with_dhcp,with_tailscale,with_openvpn,with_openconnect,badlinkname,tfogo_checklinkname0' \
            -o ../deployment/desktop/ThroneCore .
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: ThroneCore-android-regression-${{ github.sha }}
          path: deployment/android/ThroneCore.aar
          if-no-files-found: error
          compression-level: 0
